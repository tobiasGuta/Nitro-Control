<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Nitro Control application icon">
  <defs>
    <!-- Outer obsidian chassis -->
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3039"/>
      <stop offset="18%" stop-color="#181920"/>
      <stop offset="84%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#1d1115"/>
    </linearGradient>

    <!-- Machined inner plate -->
    <radialGradient id="faceplate" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#262832"/>
      <stop offset="62%" stop-color="#13141a"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>

    <!-- Brushed steel-to-crimson rim -->
    <linearGradient id="steelRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c808e"/>
      <stop offset="38%" stop-color="#3d404b"/>
      <stop offset="80%" stop-color="#282932"/>
      <stop offset="100%" stop-color="#c42535"/>
    </linearGradient>

    <!-- Nitro Control crimson-to-amber telemetry gradient -->
    <linearGradient id="nitroArc" x1="0.1" y1="0.85" x2="0.9" y2="0.15">
      <stop offset="0%" stop-color="#b4202f"/>
      <stop offset="50%" stop-color="#ef3b48"/>
      <stop offset="100%" stop-color="#fc7f1f"/>
    </linearGradient>

    <!-- Crimson-to-amber diagonal bridge -->
    <linearGradient id="nitroBridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5e3a"/>
      <stop offset="48%" stop-color="#ef3b48"/>
      <stop offset="100%" stop-color="#b91e2e"/>
    </linearGradient>

    <!-- Brushed titanium metallic pillars -->
    <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f7f9"/>
      <stop offset="32%" stop-color="#c9cdd6"/>
      <stop offset="72%" stop-color="#8b909c"/>
      <stop offset="100%" stop-color="#6b6f7b"/>
    </linearGradient>

    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.0" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.8" result="off"/>
      <feComponentTransfer in="off" result="shad">
        <feFuncA type="linear" slope="0.85"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shad"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chamfered hardware tile with rounded corners -->
  <path d="M 27 6 H 101 Q 107 6 111 10 L 118 17 Q 122 21 122 27 V 101 Q 122 107 118 111 L 111 118 Q 107 122 101 122 H 27 Q 21 122 17 118 L 10 111 Q 6 107 6 101 V 27 Q 6 21 10 17 L 17 10 Q 21 6 27 6 Z" fill="url(#chassis)"/>
  <path d="M 29 10 H 99 Q 104 10 107.5 13.5 L 114.5 20.5 Q 118 24 118 29 V 99 Q 118 104 114.5 107.5 L 107.5 114.5 Q 104 118 99 118 H 29 Q 24 118 20.5 114.5 L 13.5 107.5 Q 10 104 10 99 V 29 Q 10 24 13.5 20.5 L 20.5 13.5 Q 24 10 29 10 Z" fill="url(#faceplate)" stroke="url(#steelRim)" stroke-width="1.8"/>

  <!-- Subtle fan-rotor silhouette in dial background -->
  <circle cx="64" cy="64" r="39" fill="none" stroke="#22242c" stroke-width="6.5"/>
  <path d="M 78.0 64.0 Q 88.8 67.0 96.3 74.7 L 93.2 81.5 Q 85.2 73.0 77.1 68.9 Z M 74.7 73.0 Q 81.1 82.2 81.8 92.9 L 75.1 96.1 Q 74.5 84.5 70.9 76.2 Z M 66.4 77.8 Q 65.4 88.9 59.1 97.6 L 51.8 95.8 Q 58.8 86.5 61.4 77.8 Z M 57.0 76.1 Q 49.0 84.0 38.6 86.6 L 34.3 80.5 Q 45.6 77.9 53.2 72.9 Z M 50.8 68.8 Q 39.7 69.7 30.0 65.0 L 30.6 57.5 Q 41.0 62.8 50.0 63.8 Z M 50.8 59.2 Q 41.7 52.7 37.3 42.9 L 42.6 37.6 Q 47.1 48.3 53.4 54.9 Z M 57.0 51.9 Q 54.2 41.0 57.1 30.7 L 64.6 30.0 Q 61.2 41.1 61.7 50.2 Z M 66.4 50.2 Q 71.2 40.1 80.1 34.1 L 86.3 38.3 Q 76.5 44.7 71.1 52.0 Z M 74.7 55.0 Q 84.9 50.4 95.6 51.4 L 97.6 58.6 Q 86.0 57.2 77.2 59.4 Z" fill="#323540" opacity="0.38"/>
  <circle cx="64" cy="64" r="14" fill="#15161c" stroke="#2b2d37" stroke-width="1.2" opacity="0.65"/>

  <!-- Gauge tick marks -->
  <g stroke="#4a4e5c" stroke-width="1.5" stroke-linecap="round">
    <line x1="64" y1="21.5" x2="64" y2="25.2"/>
    <line x1="34" y1="34" x2="36.6" y2="36.6"/>
    <line x1="94" y1="34" x2="91.4" y2="36.6"/>
    <line x1="21.5" y1="64" x2="25.2" y2="64"/>
    <line x1="106.5" y1="64" x2="102.8" y2="64"/>
  </g>

  <!-- Active crimson-to-amber telemetry sweep arc -->
  <path d="M 36.4 91.6 A 39 39 0 1 1 97.8 83.5" fill="none" stroke="url(#nitroArc)" stroke-width="6.5" stroke-linecap="round" filter="url(#arcGlow)"/>

  <!-- Original twin-pillar + crimson telemetry-pulse N emblem -->
  <g filter="url(#drop)">
    <path d="M 42 84 V 44 L 52 38 V 78 Z" fill="url(#titanium)"/>
    <path d="M 76 50 L 86 44 V 84 L 76 90 Z" fill="url(#titanium)"/>
    <path d="M 42 44 L 52 38 L 86 72 L 86 84 L 76 90 L 42 56 Z" fill="url(#nitroBridge)"/>
    <path d="M 42 44 L 52 38 L 86 72 L 84 74 L 51.5 41.5 L 42 47.2 Z" fill="#ffe0cc" opacity="0.72"/>
  </g>
</svg>
